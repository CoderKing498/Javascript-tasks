<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make-O-Playlist</title>
</head>
<body>
    <header class="header">
        <div class="container-header">
            <div class="slogan">
                <img class="img-slogan" src="" alt="star">
                <p class="text-slogan">Captura tus pensamientos instataneamente</p>
            </div>
            <h1 class="title">Crea tus playlists</h1>
            <p>Escribe una canción popular y presiona 'Agregar' para guardarla en tu lista de reproducción.</p>

            <form class="form" action="">
                <input type="text" class="input-idea" id="idea" placeholder="Dale play a la guardada">
                <button class="btn-agregar" type="submit"> + Agregar</button>
            </form>
        </div>

    </header>

    <main>
        <ul id="wowPlaylist "></ul>
    </main>
</body>
</html>
